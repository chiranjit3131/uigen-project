name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Project setup
        run: |
          npm run setup
          npm run dev:daemon

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@main
        with:
          # Authenticate to the Claude API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key. See docs/setup.md.
          anthropic_api_key: "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"
          custom_instructions: |
            The project is already setup with all dependencies installed. The server is already running at localhost:3000. Logs for it are being written to logs.txt
            If needed, you can query the DB with 'sqlite3' cli. If needed use the mcp_playwright set of tools to launch a browser and interact with the app
          ncp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": [
                    "@playwright/mcp@latest",
                    "--allowed-origins",
                    "localhost:3000;cdn.tailwindcss.com;esm.sh"
                  ]
                }
             }
            }
          claude_args: |
            --allowedTools "Bash(npm:*),Bash(sqlite3:*),mcp_playwright_browser_snapshot,mcp_playwright_browser_click"
            --model "claude-opus-4-7"
